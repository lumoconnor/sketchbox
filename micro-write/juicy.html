<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>micro write (juicy)</title>
<style>
/* shared micro office styles: keep in sync with ../shared/micro.css */
:root {
  --bg: #fbfaf7;
  --fg: #222;
  --muted: #9a968e;
  --line: #e6e2da;
  --accent: #3b5bdb;
  --font: Charter, "Iowan Old Style", Georgia, "Times New Roman", serif;
  --ui: system-ui, -apple-system, "Segoe UI", sans-serif;
  --col: 38rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1b1a; --fg: #e6e3dc; --muted: #77736b; --line: #2f2e2b; --accent: #8ea6ff;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1b1a; --fg: #e6e3dc; --muted: #77736b; --line: #2f2e2b; --accent: #8ea6ff;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 1.125rem/1.7 var(--font); min-height: 100vh; }
::selection { background: color-mix(in srgb, var(--accent) 25%, transparent); }

.page { max-width: var(--col); margin: 0 auto; padding: 5rem 1rem 6rem; }

/* toolbar: fades in on hover or focus */
.bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 2;
  display: flex; justify-content: center; gap: .25rem; padding: .6rem;
  flex-wrap: wrap; background: var(--bg);
  font: .8rem var(--ui); opacity: .4; transition: opacity .2s;
}
.bar:hover, .bar:focus-within { opacity: 1; }
@media (hover: none) { .bar { opacity: 1; } }  /* touch screens can't hover */
.bar button {
  font: inherit; color: var(--muted); background: none; border: 0;
  padding: .3rem .55rem; border-radius: .3rem; cursor: pointer;
}
.bar button:hover { color: var(--fg); background: var(--line); }
.bar .sep { width: 1px; background: var(--line); margin: .2rem .3rem; }

/* quiet footer */
.foot {
  position: fixed; bottom: 0; left: 0; right: 0; padding: .6rem 1rem;
  text-align: center; font: .75rem var(--ui); color: var(--muted);
  background: linear-gradient(transparent, var(--bg) 60%);
}

@media print {
  .bar, .foot { display: none; }
  .page { padding: 0; max-width: none; }
  body { background: #fff; color: #000; }
}

/* micro write */
  #doc { outline: none; min-height: 60vh; caret-color: var(--accent); }
  #doc.empty > p:first-child::before { content: "Start writing…"; color: var(--muted); position: absolute; pointer-events: none; }
  #doc h1 { font-size: 2rem; line-height: 1.25; margin: 2rem 0 1rem; font-weight: 600; }
  #doc h2 { font-size: 1.35rem; line-height: 1.3; margin: 1.75rem 0 .5rem; font-weight: 600; }
  #doc p { margin: 0 0 1rem; }
  #doc ul { margin: 0 0 1rem; padding-left: 1.4rem; }
  #doc > :first-child { margin-top: 0; }
</style>
</head>
<body>
<nav class="bar">
  <button data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
  <button data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
  <button data-cmd="h1" title="Heading 1 (Ctrl+Alt+1, or type # )">H1</button>
  <button data-cmd="h2" title="Heading 2 (Ctrl+Alt+2, or type ## )">H2</button>
  <button data-cmd="list" title="Bullet list (Ctrl+L, or type - )">•</button>
  <span class="sep"></span>
  <button data-cmd="new" title="New document">new</button>
  <button data-cmd="open" title="Open .md or .html (Ctrl+O)">open</button>
  <button data-cmd="save" title="Save as .md (Ctrl+S)">.md</button>
  <button data-cmd="saveHtml" title="Save as .html (Ctrl+Shift+S)">.html</button>
  <button data-cmd="print" title="Print or save as PDF (Ctrl+P)">print</button>
  <button data-cmd="theme" title="Light / dark">◐</button>
</nav>
<main class="page"><div id="doc" contenteditable="true" spellcheck="true"></div></main>
<footer class="foot" id="count"></footer>
<input type="file" id="file" accept=".md,.markdown,.txt,.html,.htm" hidden>
<script>
const doc = document.getElementById('doc'), count = document.getElementById('count'), file = document.getElementById('file');
const KEY = 'micro-write:doc', THEME = 'micro-office:theme';
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const exec = (c, v) => document.execCommand(c, false, v);
exec('defaultParagraphSeparator', 'p');

/* ---- markdown: only headings, bullets, bold, italic ---- */
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const inlineMd = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>');
function fromMd(md) {
  let html = '', list = false;
  for (const line of md.replace(/\r/g, '').split('\n')) {
    const li = line.match(/^\s*[-*+]\s+(.*)/);
    if (li) { if (!list) html += '<ul>'; list = true; html += `<li>${inlineMd(li[1])}</li>`; continue; }
    if (list) { html += '</ul>'; list = false; }
    const h = line.match(/^(#{1,6})\s+(.*)/);
    if (h) html += h[1].length === 1 ? `<h1>${inlineMd(h[2])}</h1>` : `<h2>${inlineMd(h[2])}</h2>`;
    else if (line.trim()) html += `<p>${inlineMd(line)}</p>`;
  }
  return html + (list ? '</ul>' : '');
}
function inlineToMd(node) {
  let out = '';
  for (const n of node.childNodes) {
    if (n.nodeType === 3) { out += n.textContent; continue; }
    if (n.nodeType !== 1) continue;
    const t = n.tagName, inner = inlineToMd(n);
    if (t === 'BR') out += ' ';
    else if (!inner.trim()) out += inner;
    else if (t === 'B' || t === 'STRONG') out += `**${inner}**`;
    else if (t === 'I' || t === 'EM') out += `*${inner}*`;
    else out += inner;
  }
  return out.replace(/ /g, ' ');
}
const BLOCKS = 'P,H1,H2,H3,H4,H5,H6,UL,OL,DIV,SECTION,ARTICLE,MAIN,BLOCKQUOTE';
function toMd(root = doc, blocks = []) {
  for (const n of root.childNodes) {
    if (n.nodeType === 3) { if (n.textContent.trim()) blocks.push(n.textContent.trim()); continue; }
    if (n.nodeType !== 1) continue;
    const t = n.tagName;
    if (/^(P|DIV|SECTION|ARTICLE|MAIN|BLOCKQUOTE)$/.test(t) && n.querySelector(BLOCKS)) { toMd(n, blocks); continue; }
    const text = inlineToMd(n).trim();
    if (t === 'UL' || t === 'OL') blocks.push([...n.querySelectorAll('li')].map(li => '- ' + inlineToMd(li).trim()).join('\n'));
    else if (!text) continue;
    else if (t === 'H1') blocks.push('# ' + text);
    else if (/^H[2-6]$/.test(t)) blocks.push('## ' + text);
    else blocks.push(text);
  }
  return root === doc ? blocks.join('\n\n') + '\n' : blocks;
}

/* ---- formatting ---- */
const block = () => { let n = getSelection().anchorNode; while (n && n.parentNode !== doc) n = n.parentNode; return n; };
const heading = tag => exec('formatBlock', block()?.tagName === tag.toUpperCase() ? 'p' : tag);
/* lists by hand: execCommand nests <ul> inside <p> in Chrome */
const caret = el => getSelection().collapse(el, el.childNodes.length);
const filled = el => (el.firstChild || el.append(document.createElement('br')), el);
function list() {
  const b = block(); if (!b) return;
  if (b.tagName === 'UL') {               // current item back to a paragraph, splitting the list
    let li = getSelection().anchorNode; while (li.parentNode !== b) li = li.parentNode;
    const p = document.createElement('p'), rest = document.createElement('ul');
    while (li.nextSibling) rest.append(li.nextSibling);
    p.append(...li.childNodes); li.remove(); b.after(filled(p));
    if (rest.firstChild) p.after(rest);
    if (!b.firstChild) b.remove();
    return caret(p);
  }
  const prev = b.previousSibling, next = b.nextSibling, li = document.createElement('li');
  const ul = prev?.tagName === 'UL' ? prev : document.createElement('ul');
  if (ul !== prev) b.before(ul);
  li.append(...(b.nodeType === 3 ? [b] : b.childNodes)); ul.append(filled(li)); b.remove();
  if (next?.tagName === 'UL') { ul.append(...next.childNodes); next.remove(); }
  caret(li);
}
const cmds = {
  bold: () => exec('bold'), italic: () => exec('italic'),
  h1: () => heading('h1'), h2: () => heading('h2'), list,
  new: () => {                            // click twice to clear (no confirm(), which previews block)
    const btn = document.querySelector('[data-cmd=new]');
    if (doc.textContent.trim() && btn.textContent !== 'sure?') {
      btn.textContent = 'sure?'; return setTimeout(() => btn.textContent = 'new', 3000);
    }
    btn.textContent = 'new'; doc.innerHTML = ''; changed(); doc.focus();
  },
  open: () => file.click(),
  save: () => download(toMd(), 'md', 'text/markdown'),
  saveHtml: () => download(`<!doctype html>\n<meta charset="utf-8">\n<title>${esc(name())}</title>\n${fromMd(toMd())}\n`, 'html', 'text/html'),
  print: () => print(),
  theme: () => {
    const cur = document.documentElement.dataset.theme, dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'light' : 'dark';
    store.set(THEME, document.documentElement.dataset.theme);
  },
};
document.querySelector('.bar').addEventListener('mousedown', e => {
  const b = e.target.closest('button'); if (!b) return;
  e.preventDefault(); doc.focus(); cmds[b.dataset.cmd](); changed();
});
doc.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  const map = mod && (e.altKey ? { '1': 'h1', '2': 'h2' }[e.code.slice(-1)] :
    e.shiftKey ? { s: 'saveHtml' }[k] : { l: 'list', s: 'save', o: 'open', '1': 'h1', '2': 'h2' }[k]);
  if (map) { e.preventDefault(); cmds[map](); changed(); }
});
document.addEventListener('keydown', e => {   // save/open also work when the editor is not focused
  if (e.target === doc || !(e.ctrlKey || e.metaKey)) return;
  const k = e.key.toLowerCase();
  if (k === 's') { e.preventDefault(); cmds[e.shiftKey ? 'saveHtml' : 'save'](); }
  if (k === 'o') { e.preventDefault(); cmds.open(); }
});
/* markdown-style shortcuts: "# ", "## ", "- " at the start of a paragraph */
doc.addEventListener('input', e => {
  if (e.inputType !== 'insertText' || e.data !== ' ') return changed();
  const b = block(), t = b?.textContent;
  const fmt = b?.tagName === 'P' && { '# ': 'h1', '# ': 'h1', '## ': 'h2', '## ': 'h2', '- ': 'list', '- ': 'list', '* ': 'list', '* ': 'list' }[t];
  if (fmt) { b.textContent = ''; b.appendChild(document.createElement('br')); getSelection().collapse(b, 0); cmds[fmt](); }
  changed();
});
/* paste as plain text so only our four styles exist */
doc.addEventListener('paste', e => { e.preventDefault(); exec('insertText', e.clipboardData.getData('text/plain')); });

/* ---- files ---- */
const name = () => (doc.querySelector('h1')?.textContent || doc.innerText).trim().split(/\s+/).slice(0, 6).join(' ').replace(/[\\/:*?"<>|]/g, '') || 'untitled';
function download(text, ext, type) {
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([text], { type })), download: `${name()}.${ext}` });
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
file.addEventListener('change', async () => {
  const f = file.files[0]; if (!f) return;
  const text = await f.text(); file.value = '';
  if (/\.html?$/i.test(f.name)) {      // keep only what micro write understands
    const tmp = document.createElement('div');
    tmp.innerHTML = new DOMParser().parseFromString(text, 'text/html').body.innerHTML;
    doc.innerHTML = ''; doc.append(...tmp.childNodes);
    doc.innerHTML = fromMd(toMd());
  } else doc.innerHTML = fromMd(text);
  changed();
});

/* ---- autosave + count ---- */
let timer;
function changed() {
  const text = doc.innerText.trim(), words = text ? text.split(/\s+/).length : 0;
  count.textContent = `${words} ${words === 1 ? 'word' : 'words'} · ${text.replace(/\s/g, '').length} characters`;
  if (!doc.firstElementChild && !text) doc.innerHTML = '<p><br></p>';
  doc.classList.toggle('empty', !text && doc.children.length === 1 && doc.firstElementChild.tagName === 'P');
  clearTimeout(timer); timer = setTimeout(() => store.set(KEY, doc.innerHTML), 300);
}
addEventListener('beforeunload', () => store.set(KEY, doc.innerHTML));
const theme = store.get(THEME); if (theme) document.documentElement.dataset.theme = theme;
doc.innerHTML = store.get(KEY) || '';
changed(); doc.focus();
</script>
<style>
  /* juice: the native caret is hidden and redrawn as a springy overlay */
  #doc { caret-color: transparent; }
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  #fx .caret { position: absolute; left: 0; top: 0; width: 2px; border-radius: 1px; background: var(--accent);
    transform-origin: 50% 100%; will-change: transform; }
  #fx .caret.idle { animation: blink 1.1s ease-in-out .5s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #fx .ghost { position: absolute; white-space: pre; line-height: 1; transform-origin: 50% 70%; }
  #fx .cover { position: absolute; background: var(--bg); }
</style>
<script>
/* ---- juice ---- */
(() => {
  const fx = document.createElement('div'); fx.id = 'fx'; document.body.append(fx);
  const caretEl = Object.assign(document.createElement('div'), { className: 'caret' }); fx.append(caretEl);
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* sound: tiny synthesized clicks, no audio files */
  let ac, noise, muted = (() => { try { return localStorage.getItem('micro-write:mute') === '1'; } catch { return false; } })();
  function tone(type, f0, f1, dur, vol, filter) {
    ac ||= new AudioContext();
    if (!noise) { noise = ac.createBuffer(1, ac.sampleRate * .1, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const t = ac.currentTime, g = ac.createGain(), src = type === 'noise' ? ac.createBufferSource() : ac.createOscillator();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    if (type === 'noise') src.buffer = noise;
    else { src.type = type; src.frequency.setValueAtTime(f0, t); src.frequency.exponentialRampToValueAtTime(f1, t + dur); }
    let out = src;
    if (filter) { const f = ac.createBiquadFilter(); f.type = filter[0]; f.frequency.value = filter[1]; f.Q.value = filter[2] || 1; src.connect(f); out = f; }
    out.connect(g).connect(ac.destination); src.start(t); src.stop(t + dur + .02);
  }
  const vary = (x, r) => x * (1 + (Math.random() - .5) * r);
  const sounds = {
    type: () => { tone('noise', 0, 0, .03, .25, ['bandpass', vary(3200, .3), 1.2]); tone('sine', vary(1500, .15), 900, .035, .05); },
    del:  () => { tone('sine', vary(260, .1), 110, .08, .18); tone('noise', 0, 0, .045, .15, ['lowpass', 900]); },
  };
  const play = k => { if (!muted) try { sounds[k](); } catch {} };
  const btn = Object.assign(document.createElement('button'), { title: 'Key sounds on / off', textContent: muted ? '♪̸' : '♪' });
  btn.addEventListener('mousedown', e => { e.preventDefault(); muted = !muted; btn.textContent = muted ? '♪̸' : '♪';
    try { localStorage.setItem('micro-write:mute', muted ? '1' : '0'); } catch {} });
  document.querySelector('.bar').append(btn);

  function slices(range) {
    const out = [], root = range.commonAncestorContainer;
    const walk = document.createTreeWalker(root.nodeType === 3 ? root.parentNode : root, NodeFilter.SHOW_TEXT);
    for (let n; (n = walk.nextNode());) {
      if (!range.intersectsNode(n)) continue;
      const r = document.createRange();
      r.setStart(n, n === range.startContainer ? range.startOffset : 0);
      r.setEnd(n, n === range.endContainer ? range.endOffset : n.length);
      if (!r.collapsed) out.push(r);
    }
    return out;
  }
  function caretRect(r) {
    const rects = r.getClientRects();
    if (rects.length) return rects[rects.length - 1];
    let el = r.startContainer.nodeType === 1 ? (r.startContainer.childNodes[r.startOffset] || r.startContainer) : r.startContainer.parentNode;
    if (el.nodeType !== 1 || el.tagName === 'BR') el = el.parentNode || el;
    if (el === doc) el = doc.firstElementChild || doc;
    const b = el.getBoundingClientRect(), s = getComputedStyle(el), fs = parseFloat(s.fontSize);
    return { left: b.left + parseFloat(s.paddingLeft), top: b.top + parseFloat(s.paddingTop) + (parseFloat(s.lineHeight) - fs * 1.15) / 2, height: fs * 1.15 };
  }

  /* caret: a spring that stretches and leans with its velocity */
  const c = { x: 0, y: 0, h: 20, vx: 0, vy: 0, vh: 0, tx: 0, ty: 0, th: 20, on: false, moving: false, fresh: true };
  const W = 28, Z = 1;                         // spring speed (rad/s), critically damped
  let lastT = 0, raf = 0;
  function target() {
    const sel = getSelection(), on = document.activeElement === doc && sel.rangeCount && doc.contains(sel.focusNode);
    c.on = !!on; caretEl.style.opacity = on ? '' : 0;
    if (!on) return void (c.fresh = true);   // reappearing after blur snaps into place
    const f = document.createRange(); f.setStart(sel.focusNode, sel.focusOffset);   // follows the moving end of a selection too
    const r = caretRect(f);
    c.tx = r.left - 1; c.ty = r.top; c.th = r.height;
    if (c.fresh || calm) { c.x = c.tx; c.y = c.ty; c.h = c.th; c.vx = c.vy = 0; c.fresh = false; }
    if (!raf) { lastT = performance.now(); raf = requestAnimationFrame(step); }
  }
  function step(now) {
    const dt = Math.min((now - lastT) / 1000, 1 / 30); lastT = now;
    for (const [p, v, t] of [['x', 'vx', 'tx'], ['y', 'vy', 'ty'], ['h', 'vh', 'th']]) {
      const before = c[t] - c[p];
      c[v] += (W * W * before - 2 * Z * W * c[v]) * dt; c[p] += c[v] * dt;
      if (before * (c[t] - c[p]) < 0) { c[p] = c[t]; c[v] = 0; }   // never overshoot
    }
    const speed = Math.hypot(c.vx, c.vy), done = speed < 2 && Math.abs(c.tx - c.x) < .3 && Math.abs(c.ty - c.y) < .3;
    if (done) { c.x = c.tx; c.y = c.ty; c.h = c.th; c.vx = c.vy = c.vh = 0; }
    const lean = Math.max(-28, Math.min(28, c.vx / 80));            // degrees, tips toward the direction of travel
    const stretchX = 1 + Math.min(Math.abs(c.vx) / 400, 4);          // wider when moving sideways fast
    const stretchY = 1 + Math.min(Math.abs(c.vy) / 1800, .8) - Math.min(Math.abs(c.vx) / 6000, .2);
    const trail = c.vx > 0 ? -2 * (stretchX - 1) : 0;                // widen behind the motion, not ahead of it
    caretEl.style.height = c.h + 'px';
    caretEl.style.transform = `translate(${c.x + trail}px, ${c.y}px) skewX(${-lean}deg) scale(${stretchX}, ${stretchY})`;
    caretEl.style.transformOrigin = c.vx > 0 ? '100% 100%' : '0 100%';
    const moving = !done;
    if (moving !== c.moving) { c.moving = moving; caretEl.classList.toggle('idle', !moving); }

  }
  const wake = () => { caretEl.classList.remove('idle'); void caretEl.offsetWidth; if (!c.moving) caretEl.classList.add('idle'); };

  // a floating copy of a character, styled like the original
  function ghost(text, rect, from) {
    const el = document.createElement('span'), s = getComputedStyle(from);
    el.className = 'ghost'; el.textContent = text;
    Object.assign(el.style, { left: rect.left + 'px', top: rect.top + 'px', height: rect.height + 'px', lineHeight: rect.height + 'px',
      font: `${s.fontStyle} ${s.fontWeight} ${s.fontSize} ${s.fontFamily}` });
    fx.append(el); return el;
  }

  // typing: each new letter fades in over 0.25s (a page-coloured cover fades away)
  /* after a delete, the text that follows slides into its new place on the caret's spring */
  let slide = null, pending = null;
  const blockOf = n => (n.nodeType === 3 ? n.parentNode : n).closest('li, p, h1, h2') || doc;
  function charsAfter(node, offset, block) {
    const r = document.createRange(), out = [];
    try { r.setStart(node, offset); r.setEnd(block, block.childNodes.length); } catch { return out; }
    for (const s of slices(r)) for (let i = s.startOffset; i < s.endOffset && out.length < 400; i++) {
      const q = document.createRange(); q.setStart(s.startContainer, i); q.setEnd(s.startContainer, i + 1);
      out.push({ ch: s.startContainer.data[i], rect: q.getClientRects()[0], from: s.startContainer.parentNode });
    }
    return out;
  }
  const springAt = t => (1 + W * t) * Math.exp(-W * t);   // critically damped: 1 -> 0, never overshoots
  function endSlide() { if (!slide) return; cancelAnimationFrame(slide.raf); slide.els.forEach(el => el.remove()); slide = null; }
  function startSlide(before, after, shift) {
    const now = performance.now(), prevF = slide ? springAt((now - slide.t0) / 1000) : 0, prev = slide?.chars || [];
    endSlide();
    const chars = [], els = [], lines = [];
    after.forEach((a, i) => {
      const b = before[i], p = prev[i + shift];
      if (!a.rect || !b.rect) return;
      const dx = b.rect.left - a.rect.left + (p ? p.dx * prevF : 0), dy = b.rect.top - a.rect.top + (p ? p.dy * prevF : 0);
      const l = lines.find(l => Math.abs(l.top - a.rect.top) < 4);
      if (l) { l.left = Math.min(l.left, a.rect.left); l.right = Math.max(l.right, a.rect.right); l.h = Math.max(l.h, a.rect.height); }
      else lines.push({ top: a.rect.top, left: a.rect.left, right: a.rect.right, h: a.rect.height });
      const ch = { dx, dy }; chars[i] = ch;
      if (a.ch.trim()) { ch.el = ghost(a.ch, a.rect, a.from); fx.insertBefore(ch.el, caretEl); }
    });
    for (const l of lines) {                 // hide the real text while its copies glide in
      const el = Object.assign(document.createElement('div'), { className: 'cover' });
      Object.assign(el.style, { left: l.left - 1 + 'px', top: l.top + 'px', width: l.right - l.left + 3 + 'px', height: l.h + 'px', opacity: 1 });
      fx.insertBefore(el, fx.firstChild); els.push(el);
    }
    chars.forEach(c => c?.el && els.push(c.el));
    slide = { chars, els, t0: now };
    const tick = t => {
      const f = springAt((t - slide.t0) / 1000);
      if (f < .004) return endSlide();
      for (const c of chars) if (c?.el) c.el.style.transform = `translate(${c.dx * f}px, ${c.dy * f}px)`;
      slide.raf = requestAnimationFrame(tick);
    };
    tick(now);
  }

  doc.addEventListener('input', e => {
    if (pending && e.inputType.startsWith('delete')) {
      const { before, block, shift } = pending, sel = getSelection();
      if (block.isConnected && sel.focusNode && blockOf(sel.focusNode) === block) {
        const after = charsAfter(sel.focusNode, sel.focusOffset, block);
        if (after.length === before.length && after.length) startSlide(before, after, shift); else endSlide();
      } else endSlide();
    } else endSlide();
    pending = null;
    target(); wake();
    if (/^insert(Text|Paragraph|ReplacementText)/.test(e.inputType)) play('type');
    if (calm || !/^insert(Text|ReplacementText)$/.test(e.inputType) || !e.data || e.data.length > 3) return;
    const sel = getSelection(), n = sel.anchorNode, o = sel.anchorOffset;
    if (!n || n.nodeType !== 3 || o < e.data.length) return;
    const r = document.createRange(); r.setStart(n, o - e.data.length); r.setEnd(n, o);
    for (const q of r.getClientRects()) {
      const el = Object.assign(document.createElement('div'), { className: 'cover' });
      Object.assign(el.style, { left: q.left - .5 + 'px', top: q.top + 'px', width: q.width + 1 + 'px', height: q.height + 'px' });
      fx.insertBefore(el, caretEl);
      el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 250, easing: 'ease-out', fill: 'forwards' }).onfinish = () => el.remove();
    }
  });

  // deleting: the letters drop away and tumble out
  doc.addEventListener('beforeinput', e => {
    if (!e.inputType.startsWith('delete')) return;
    play('del'); if (calm) return;
    const t = e.getTargetRanges()[0]; if (!t) return;
    const range = document.createRange(); range.setStart(t.startContainer, t.startOffset); range.setEnd(t.endContainer, t.endOffset);
    const block = blockOf(t.startContainer);
    pending = block !== doc && block === blockOf(t.endContainer)
      ? { block, before: charsAfter(t.endContainer, t.endOffset, block), shift: e.inputType.includes('Forward') ? range.toString().length : 0 } : null;
    const chars = [];
    for (const s of slices(range)) for (let i = s.startOffset; i < s.endOffset && chars.length < 250; i++) {
      const ch = s.startContainer.data[i]; if (!ch.trim()) continue;
      const r = document.createRange(); r.setStart(s.startContainer, i); r.setEnd(s.startContainer, i + 1);
      const rect = r.getClientRects()[0]; if (rect) chars.push([ch, rect, s.startContainer.parentNode]);
    }
    const back = !e.inputType.includes('Forward');
    chars.forEach(([ch, rect, from], i) => {
      const g = ghost(ch, rect, from); g.style.color = 'var(--muted)';
      const dx = (Math.random() - .5) * 30 + (back ? 6 : -6), dy = 18 + Math.random() * 30, rot = (Math.random() - .5) * 70;
      g.animate([{ transform: 'none', opacity: .8 }, { transform: `translate(${dx}px, ${dy}px) rotate(${rot}deg) scale(.6)`, opacity: 0 }],
        { duration: 420 + Math.random() * 200, delay: Math.min(i * 4, 200), easing: 'cubic-bezier(.5,0,.9,.6)', fill: 'backwards' }).onfinish = () => g.remove();
    });
  });

  document.addEventListener('selectionchange', target);
  doc.addEventListener('focus', target); doc.addEventListener('blur', target);
  addEventListener('scroll', () => { c.fresh = true; target(); }, true); addEventListener('resize', () => { c.fresh = true; target(); });
  requestAnimationFrame(target);
})();
</script>
</body>
</html>
