<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>micro sheet</title>
<style>
/* shared micro office styles: keep in sync with ../shared/micro.css */
:root {
  --bg: #fbfaf7;
  --fg: #222;
  --muted: #9a968e;
  --line: #e6e2da;
  --accent: #3b5bdb;
  --font: Charter, "Iowan Old Style", Georgia, "Times New Roman", serif;
  --ui: system-ui, -apple-system, "Segoe UI", sans-serif;
  --col: 38rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1b1a; --fg: #e6e3dc; --muted: #77736b; --line: #2f2e2b; --accent: #8ea6ff;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1b1a; --fg: #e6e3dc; --muted: #77736b; --line: #2f2e2b; --accent: #8ea6ff;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 1.125rem/1.7 var(--font); min-height: 100vh; }
::selection { background: color-mix(in srgb, var(--accent) 25%, transparent); }

.page { max-width: var(--col); margin: 0 auto; padding: 5rem 1rem 6rem; }

/* toolbar: fades in on hover or focus */
.bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 2;
  display: flex; justify-content: center; gap: .25rem; padding: .6rem;
  flex-wrap: wrap; background: var(--bg);
  font: .8rem var(--ui); opacity: .4; transition: opacity .2s;
}
.bar:hover, .bar:focus-within { opacity: 1; }
@media (hover: none) { .bar { opacity: 1; } }  /* touch screens can't hover */
.bar button {
  font: inherit; color: var(--muted); background: none; border: 0;
  padding: .3rem .55rem; border-radius: .3rem; cursor: pointer;
}
.bar button:hover { color: var(--fg); background: var(--line); }
.bar .sep { width: 1px; background: var(--line); margin: .2rem .3rem; }

/* quiet footer */
.foot {
  position: fixed; bottom: 0; left: 0; right: 0; padding: .6rem 1rem;
  text-align: center; font: .75rem var(--ui); color: var(--muted);
  background: linear-gradient(transparent, var(--bg) 60%);
}

@media print {
  .bar, .foot { display: none; }
  .page { padding: 0; max-width: none; }
  body { background: #fff; color: #000; }
}

/* micro sheet */
  #grid { position: fixed; inset: 2.8rem 0 2.4rem; overflow: auto; outline: none; scroll-padding: 2rem 0 0 3.2rem; }
  table { border-collapse: collapse; table-layout: fixed; width: max-content; font-size: .95rem; line-height: 1.8rem; }
  td, th { border: 1px solid var(--line); height: 1.8rem; padding: 0 .4rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  thead th { width: 6.5rem; }
  thead th:first-child { width: 3rem; }
  td { position: relative; font-variant-numeric: tabular-nums; cursor: cell; }
  td.num { text-align: right; }
  td.on { outline: 2px solid var(--accent); outline-offset: -2px; }
  th { font: .7rem var(--ui); color: var(--muted); background: var(--bg); position: sticky; font-weight: 400; }
  thead th { top: 0; z-index: 1; }
  tbody th { left: 0; }
  thead th:first-child { left: 0; z-index: 2; }
  #ed { position: absolute; inset: 0; width: 100%; border: 0; padding: 0 .4rem; font: inherit; color: inherit;
        background: var(--bg); outline: 2px solid var(--accent); outline-offset: -2px; }
</style>
</head>
<body>
<nav class="bar">
  <button data-cmd="new" title="New sheet">new</button>
  <button data-cmd="open" title="Open .csv (Ctrl+O)">open</button>
  <button data-cmd="save" title="Save as .csv (Ctrl+S)">.csv</button>
  <span class="sep"></span>
  <button data-cmd="undo" title="Undo (Ctrl+Z)">undo</button>
  <button data-cmd="redo" title="Redo (Ctrl+Y)">redo</button>
  <button data-cmd="theme" title="Light / dark">◐</button>
</nav>
<div id="grid" tabindex="0"></div>
<footer class="foot" id="foot"></footer>
<input id="ed" autocomplete="off" spellcheck="false">
<input type="file" id="file" accept=".csv,.txt" hidden>
<script>
const grid = document.getElementById('grid'), foot = document.getElementById('foot'), ed = document.getElementById('ed'), file = document.getElementById('file');
const KEY = 'micro-sheet:doc', THEME = 'micro-office:theme';
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
ed.remove();

/* ---- cells: data maps "B3" to what was typed ---- */
let data = {}, fname = 'untitled', cols = 26, rows = 100, cur = [0, 0], editing = false, tds = [];
const colName = n => { let s = ''; for (n++; n; n = (n - 1) / 26 | 0) s = String.fromCharCode(65 + (n - 1) % 26) + s; return s; };
const colNum = s => [...s].reduce((n, ch) => n * 26 + ch.charCodeAt(0) - 64, 0) - 1;
const id = (c, r) => colName(c) + (r + 1);
const parseId = s => { const m = /^([A-Z]+)(\d+)$/.exec(s); return m && [colNum(m[1]), +m[2] - 1]; };

/* ---- formulas: + - * / ( ), refs like A1, and SUM AVG MIN MAX COUNT over ranges like A1:B9 ---- */
const ERRS = new Set(['#ERR', '#CYCLE', '#DIV/0', '#VALUE']);
const num = v => { if (ERRS.has(v)) throw v; if (v === '') return 0; if (typeof v === 'number') return v; throw '#VALUE'; };
const nums = a => a.filter(v => { if (ERRS.has(v)) throw v; return typeof v === 'number'; });
const sum = a => nums(a).reduce((s, x) => s + x, 0);
const FN = {
  SUM: sum,
  AVG: a => { const n = nums(a).length; if (!n) throw '#DIV/0'; return sum(a) / n; },
  MIN: a => nums(a).length ? Math.min(...nums(a)) : 0,
  MAX: a => nums(a).length ? Math.max(...nums(a)) : 0,
  COUNT: a => nums(a).length,
};
FN.AVERAGE = FN.AVG;
let cache = {};
function value(cell, stack = new Set()) {
  if (cell in cache) return cache[cell];
  const raw = data[cell] ?? '';
  if (raw[0] !== '=') return cache[cell] = raw.trim() !== '' && isFinite(raw) ? +raw : raw;
  if (stack.has(cell)) throw '#CYCLE';
  stack.add(cell);
  let v; try { v = formula(raw.slice(1), stack); } catch (e) { v = ERRS.has(e) ? e : '#ERR'; }
  stack.delete(cell);
  return cache[cell] = v;
}
function formula(src, stack) {
  const t = src.toUpperCase().match(/\d+\.?\d*|\.\d+|[A-Z]+\d+(:[A-Z]+\d+)?|[A-Z]+|\S/g) || [];
  let i = 0;
  const peek = () => t[i], next = () => t[i++], want = x => { if (next() !== x) throw '#ERR'; };
  function expr() {
    let v = term();
    while (peek() === '+' || peek() === '-') { const op = next(), r = term(); v = op === '+' ? num(v) + num(r) : num(v) - num(r); }
    return v;
  }
  function term() {
    let v = factor();
    while (peek() === '*' || peek() === '/') {
      const op = next(), r = num(factor());
      if (op === '/' && r === 0) throw '#DIV/0';
      v = op === '*' ? num(v) * r : num(v) / r;
    }
    return v;
  }
  function factor() {
    const x = next();
    if (x === '-') return -num(factor());
    if (x === '+') return num(factor());
    if (x === '(') { const v = expr(); want(')'); return v; }
    if (/^[\d.]/.test(x)) return +x;
    if (/^[A-Z]+\d+$/.test(x)) return value(x, stack);
    if (FN[x]) {
      want('('); const args = [];
      if (peek() !== ')') do args.push(...(peek()?.includes(':') ? range(next()) : [expr()])); while (peek() === ',' && next());
      want(')'); return FN[x](args);
    }
    throw '#ERR';
  }
  function range(s) {
    const [[c1, r1], [c2, r2]] = s.split(':').map(parseId), out = [];
    for (let c = Math.min(c1, c2); c <= Math.max(c1, c2); c++)
      for (let r = Math.min(r1, r2); r <= Math.max(r1, r2); r++) out.push(value(id(c, r), stack));
    return out;
  }
  const v = expr();
  if (i < t.length) throw '#ERR';
  return v;
}
const show = v => typeof v === 'number' ? (isFinite(v) ? String(+v.toPrecision(12)) : '#ERR') : v;

/* ---- grid ---- */
function build() {
  for (const k in data) { const [c, r] = parseId(k); cols = Math.max(cols, c + 1); rows = Math.max(rows, r + 1); }
  let h = '<table><thead><tr><th></th>';
  for (let c = 0; c < cols; c++) h += `<th>${colName(c)}</th>`;
  h += '</tr></thead><tbody>';
  for (let r = 0; r < rows; r++) h += `<tr><th>${r + 1}</th>` + `<td></td>`.repeat(cols) + '</tr>';
  grid.innerHTML = h + '</tbody></table>';
  tds = [...grid.querySelectorAll('tbody tr')].map(tr => [...tr.querySelectorAll('td')]);
  render(); select(...cur);
}
function render() {
  cache = {};
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const td = tds[r][c], k = id(c, r);
    if (!(k in data)) { if (td.firstChild && td.firstChild !== ed) td.textContent = ''; td.classList.remove('num'); continue; }
    const v = value(k);
    td.textContent = show(v); td.classList.toggle('num', typeof v === 'number');
  }
  info();
}
function info() { const k = id(...cur); foot.textContent = data[k] ? `${k} · ${data[k]}` : k; }
function select(c, r) {
  c = Math.max(0, Math.min(cols - 1, c)); r = Math.max(0, Math.min(rows - 1, r));
  tds[cur[1]]?.[cur[0]]?.classList.remove('on');
  cur = [c, r]; const td = tds[r][c];
  td.classList.add('on'); td.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  info();
}
const move = (dc, dr) => select(cur[0] + dc, cur[1] + dr);

/* ---- editing ---- */
let undos = [], redos = [];
function set(cells) {                    // cells: { B3: 'text', ... }, one undo step
  const before = JSON.stringify(data);
  for (const k in cells) { if (cells[k] === '') delete data[k]; else data[k] = cells[k]; }
  if (JSON.stringify(data) === before) return;
  undos.push(before); redos = []; if (undos.length > 200) undos.shift();
  changed();
}
function edit(text) {
  const k = id(...cur);
  ed.value = text ?? data[k] ?? '';
  tds[cur[1]][cur[0]].append(ed); editing = true; ed.focus();
}
function stop(save) {
  if (!editing) return;
  editing = false; const v = ed.value; ed.remove(); grid.focus({ preventScroll: true });
  if (save) set({ [id(...cur)]: v });
}
ed.addEventListener('keydown', e => {
  const go = { Enter: [0, e.shiftKey ? -1 : 1], Tab: [e.shiftKey ? -1 : 1, 0] }[e.key];
  if (go) { e.preventDefault(); stop(true); move(...go); }
  else if (e.key === 'Escape') stop(false);
  e.stopPropagation();
});
ed.addEventListener('blur', () => stop(true));
grid.addEventListener('mousedown', e => {
  const td = e.target.closest('td'); if (!td || e.target === ed) return;
  e.preventDefault();
  const r = td.parentNode.rowIndex - 1, c = td.cellIndex - 1;
  if (editing) stop(true);
  if (c === cur[0] && r === cur[1]) edit(); else { select(c, r); grid.focus({ preventScroll: true }); }
});

/* ---- commands ---- */
const cmds = {
  new: () => {                            // click twice to clear (no confirm(), which previews block)
    const btn = document.querySelector('[data-cmd=new]');
    if (Object.keys(data).length && btn.textContent !== 'sure?') {
      btn.textContent = 'sure?'; return setTimeout(() => btn.textContent = 'new', 3000);
    }
    btn.textContent = 'new'; set(Object.fromEntries(Object.keys(data).map(k => [k, '']))); fname = 'untitled'; select(0, 0);
  },
  open: () => file.click(),
  save: () => {
    let w = 0, h = 0;
    for (const k in data) { const [c, r] = parseId(k); w = Math.max(w, c + 1); h = Math.max(h, r + 1); }
    const q = s => /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    const text = Array.from({ length: h }, (_, r) => Array.from({ length: w }, (_, c) => q(data[id(c, r)] ?? '')).join(',')).join('\n') + '\n';
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([text], { type: 'text/csv' })), download: `${fname}.csv` });
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },
  undo: () => { if (undos.length) { redos.push(JSON.stringify(data)); data = JSON.parse(undos.pop()); changed(); } },
  redo: () => { if (redos.length) { undos.push(JSON.stringify(data)); data = JSON.parse(redos.pop()); changed(); } },
  theme: () => {
    const now = document.documentElement.dataset.theme, dark = now ? now === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'light' : 'dark';
    store.set(THEME, document.documentElement.dataset.theme);
  },
};
document.querySelector('.bar').addEventListener('mousedown', e => {
  const b = e.target.closest('button'); if (!b) return;
  e.preventDefault(); stop(true); cmds[b.dataset.cmd](); grid.focus({ preventScroll: true });
});
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod) {
    const c = { s: 'save', o: 'open', z: e.shiftKey ? 'redo' : 'undo', y: 'redo' }[k];
    if (c) { e.preventDefault(); cmds[c](); }
    return;
  }
  if (e.target !== grid && e.target !== document.body) return;
  const arrows = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], Tab: [e.shiftKey ? -1 : 1, 0] }[e.key];
  if (arrows) { e.preventDefault(); move(...arrows); }
  else if (e.key === 'Enter' || e.key === 'F2') { e.preventDefault(); edit(); }
  else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); set({ [id(...cur)]: '' }); }
  else if (e.key === 'Home') { e.preventDefault(); select(0, cur[1]); }
  else if (e.key.length === 1 && !e.altKey) { e.preventDefault(); edit(e.key); }
});

/* ---- clipboard: one cell out, a block of tab-separated cells in ---- */
document.addEventListener('copy', e => { if (editing) return; e.preventDefault(); e.clipboardData.setData('text/plain', data[id(...cur)] ?? ''); });
document.addEventListener('cut', e => { if (editing) return; e.preventDefault(); e.clipboardData.setData('text/plain', data[id(...cur)] ?? ''); set({ [id(...cur)]: '' }); });
document.addEventListener('paste', e => {
  if (editing) return; e.preventDefault();
  const lines = e.clipboardData.getData('text/plain').replace(/\r/g, '').replace(/\n$/, '').split('\n'), cells = {};
  lines.forEach((line, r) => line.split('\t').forEach((v, c) => cells[id(cur[0] + c, cur[1] + r)] = v));
  set(cells);
});

/* ---- csv in ---- */
function parseCsv(s) {
  const out = [[]]; let f = '', q = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (q) { if (ch !== '"') f += ch; else if (s[i + 1] === '"') { f += '"'; i++; } else q = false; }
    else if (ch === '"') q = true;
    else if (ch === ',') { out.at(-1).push(f); f = ''; }
    else if (ch === '\n') { out.at(-1).push(f); f = ''; out.push([]); }
    else if (ch !== '\r') f += ch;
  }
  out.at(-1).push(f);
  return out;
}
file.addEventListener('change', async () => {
  const f = file.files[0]; if (!f) return;
  const text = await f.text(); file.value = '';
  undos.push(JSON.stringify(data)); redos = []; data = {};
  parseCsv(text.replace(/^﻿/, '')).forEach((row, r) => row.forEach((v, c) => { if (v !== '') data[id(c, r)] = v; }));
  fname = f.name.replace(/\.[^.]*$/, '') || 'untitled'; cur = [0, 0];
  changed();
});

/* ---- autosave ---- */
let timer;
function changed() {
  const big = Object.keys(data).some(k => { const [c, r] = parseId(k); return c >= cols || r >= rows; });
  big ? build() : render();
  clearTimeout(timer); timer = setTimeout(save, 300);
}
const save = () => store.set(KEY, JSON.stringify({ data, fname }));
addEventListener('beforeunload', save);
const theme = store.get(THEME); if (theme) document.documentElement.dataset.theme = theme;
try { ({ data = {}, fname = 'untitled' } = JSON.parse(store.get(KEY)) || {}); } catch {}
build(); grid.focus();
</script>
</body>
</html>
